<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>OrbitTab 完全活用ガイド</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.8;
            color: #eee;
            /* 背景設定 */
            background-color: #090a0f;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* メインの半透明コンテナ */
        .main-container {
            max-width: 800px;
            width: 100%;
            background: rgba(0, 0, 0, 0.7); /* 少し暗めの半透明 */
            backdrop-filter: blur(15px);   /* 背後をぼかす（グラスモーフィズム） */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 { color: #00d2ff; border-bottom: 2px solid #00d2ff; padding-bottom: 15px; text-align: center; margin-top: 0; }
        h2 { color: #00d2ff; margin-top: 30px; display: flex; align-items: center; font-size: 1.4em; }
        
        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .icon { font-size: 1.2em; margin-right: 12px; }
        b { color: #00d2ff; }
        
        .back-link { 
            display: inline-block; 
            margin-top: 30px; 
            color: #00d2ff; 
            text-decoration: none; 
            border: 1px solid #00d2ff; 
            padding: 10px 25px; 
            border-radius: 30px; 
            transition: 0.3s;
            background: rgba(0, 210, 255, 0.1);
        }
        .back-link:hover { 
            background: #00d2ff; 
            color: #000; 
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }
    </style>
</head>
<body id="guide-body">
    <div class="main-container">
        <h1>🚀 OrbitTab 完全活用ガイド</h1>

        <div class="feature-card">
            <h2><span class="icon">✨</span>AIアシスタント</h2>
            <p>Gemini, ChatGPT, Claudeをワンクリックで起動。初回に選択したAIを記憶します。<b>右クリック</b>でAIの種類を変更可能です。</p>
        </div>

        <div class="feature-card">
            <h2><span class="icon">🗑️</span>リンクの個別整理</h2>
            <p>カテゴリ内のリンクにマウスを重ねると表示される<b>赤い「×」</b>で、不要なリンクを個別に削除できます。</p>
        </div>

        <div style="text-align: center;">
            <a href="#" id="close-btn" class="back-link">← このタブを閉じて戻る</a>
        </div>
    </div>

    <script src="js/guide-script.js"></script>
</body>
</html>
