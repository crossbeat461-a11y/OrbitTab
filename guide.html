<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>OrbitTab 完全網羅ガイド</title>
    <style>
        body { font-family: sans-serif; background: #090a0f; color: #eee; padding: 40px; line-height: 1.6; }
        .container { max-width: 800px; margin: auto; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); }
        h1, h2 { color: #00d2ff; }
        .card { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .back-btn { display: block; text-align: center; color: #00d2ff; text-decoration: none; border: 1px solid #00d2ff; padding: 10px; border-radius: 20px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 OrbitTab 完全マニュアル</h1>
        <div class="card">
            <h2>📥 リンクのインポート</h2>
            <p>1. 📥ボタンでPCからブックマークHTMLを読み込みます。<br>2. ➕ボタンを押し、表示された番号を入力してBOXを画面に出します。</p>
        </div>
        <div class="card">
            <h2>✨ AI & サイドパネル</h2>
            <p>・✨ボタンをクリックして好みのAIを登録。次からは1クリックで起動します。<br>・設定を変えたい時は<b>右クリック</b>でリセットできます。</p>
        </div>
        <div class="card">
            <h2>🛠 BOXの操作</h2>
            <p>・<b>リサイズ:</b> BOXの右下をドラッグして自由に変形可能。<br>・<b>削除:</b> リンクにマウスを乗せて「×」をクリック。<br>・<b>移動:</b> ヘッダーを掴んでドラッグ。</p>
        </div>
        <a href="#" id="close-btn" class="back-btn">閉じる</a>
    </div>
    <script src="js/guide-script.js"></script>
</body>
</html>
