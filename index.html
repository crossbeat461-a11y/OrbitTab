<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NestTab v2</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="bg-container"></div>
    <div id="calendar-wrapper" class="calendar-unit" style="display:none;">
    <div class="category-box calendar-box">
        <div class="category-header">
            <h3 class="category-title">Schedule</h3>
            <span id="close-cal-btn" class="cat-delete-btn">×</span>
        </div>
        <div id="calendar-content">
            </div>
    </div>
</div>
    
    <div class="main-interface">
        <div class="info-unit">
            <div id="clock">00:00</div>
            <div id="date">----年--月--日(--)</div>
            <div id="weather-display">Sunny / 22°C</div>
        </div>

        <div class="search-unit">
            <form action="https://www.google.com/search" method="get">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" name="q" placeholder="Google で検索" autocomplete="off">
                </div>
            </form>
        </div>

        <div id="widgets-container" class="widgets-container"></div>

        <button id="add-cat-btn" class="control-btn" title="カテゴリを追加">＋</button>
        
        <input type="file" id="bg-input" style="display:none" accept="image/*">
        <button id="bg-change-btn" class="control-btn" title="背景画像を変更">🖼️</button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
