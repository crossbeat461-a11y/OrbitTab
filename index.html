<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>OrbitTab | Global Cockpit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="bg-container"></div>
    <div class="main-interface">
        <div class="info-unit">
            <div id="clock">00:00</div>
            <div id="date">----年--月--日(--)</div>
        </div>

        <div id="widgets-container"></div>

        <div class="bottom-controls">
            <button id="guide-btn" class="control-btn" data-tooltip="ガイド">📖</button>
            <button id="note-setup-btn" class="control-btn" data-tooltip="付箋追加">📝</button>
            <button id="cal-setup-btn" class="control-btn" data-tooltip="カレンダー">📅</button>
            <button id="add-cat-btn" class="control-btn" data-tooltip="カテゴリ追加">＋</button>
            <button id="bg-change-btn" class="control-btn" data-tooltip="背景変更">🖼️</button>
            <button id="import-bookmarks-btn" class="control-btn" data-tooltip="ブックマークをインポート">📥</button>
        </div><input type="file" id="bookmark-input" style="display:none" accept=".html">
        <input type="file" id="bg-input" style="display:none" accept="image/*">
        <input type="file" id="bg-input" style="display:none" accept="image/*">
    </div>
    <script src="js/script.js"></script>
</body>
</html>
