<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitTab | Your Control Center</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="bg-container"></div>

    <div class="main-interface">
        <div class="info-unit">
            <div id="clock">00:00</div>
            <div id="date">----年--月--日(--)</div>
        </div>

        <div class="search-unit">
            <form action="https://www.google.com/search" method="get">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" name="q" placeholder="OrbitTab で検索" autocomplete="off">
                </div>
            </form>
        </div>

        <div id="info-row" class="info-row" style="display: none;">
            <div id="calendar-wrapper" class="info-column"></div>
            <div id="notes-wrapper" class="info-column"></div>
        </div>

        <div id="widgets-container" class="widgets-container"></div>

        <div class="bottom-controls">
            <button id="guide-btn" class="control-btn" title="OrbitTab マガジン (note)">📖</button>
            <button id="note-setup-btn" class="control-btn" title="付箋を追加">📝</button>
            <button id="cal-setup-btn" class="control-btn" title="カレンダー設定">📅</button>
            <button id="add-cat-btn" class="control-btn" title="カテゴリ追加">＋</button>
            <button id="bg-change-btn" class="control-btn" title="背景変更">🖼️</button>
        </div>
        
        <input type="file" id="bg-input" style="display:none" accept="image/*">
    </div>

    <script src="js/script.js"></script>
</body>
</html>
