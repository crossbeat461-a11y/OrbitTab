<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NestTab v2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-container"></div>
    
    <div class="main-interface">
        <div class="info-unit">
            <div id="clock">00:00</div>
            <div id="date">2026年4月2日(木)</div>
            <div id="weather">--°C / 読み込み中...</div>
        </div>

        <div class="search-unit">
            <form action="https://www.google.com/search" method="get">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" name="q" placeholder="Google で検索または URL を入力" autocomplete="off">
                    <div class="search-tools">
                        <span>🎙️</span> <span>📷</span> </div>
                </div>
            </form>
        </div>

        <input type="file" id="bg-input" style="display:none" accept="image/*">
        <button id="bg-change-btn">背景を変更</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
